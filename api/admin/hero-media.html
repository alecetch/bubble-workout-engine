<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Images</title><style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#18212f;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:28px 34px 60px 224px!important}h1{margin:0;font-size:27px}header,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.note{color:#5d6878;margin:7px 0 22px}.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #24334a0b}button{border:0;border-radius:7px;padding:9px 13px;background:#1769e0;color:white;font-weight:600;cursor:pointer}button.secondary{background:#e8eef8;color:#24405f}button.danger{background:#a82d3a}button:disabled{opacity:.45;cursor:not-allowed}select,input{padding:8px;border:1px solid #ccd4df;border-radius:6px;background:white}.matrix{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e7eaf0;padding:9px;vertical-align:middle}th{color:#526174;font-size:11px;text-transform:uppercase}.thumb{width:74px;height:46px;object-fit:cover;border-radius:6px;background:#e8ebef}.cell{min-width:125px}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#e8eef8;font-size:11px}.badge.generic,.badge.none,.badge.missing,.badge.case_mismatch{background:#ffe6c7;color:#873f00}.badge.found,.badge.exact{background:#dff5e8;color:#176137}.inactive{opacity:.55}#sync.dirty{background:#fff4d9;border-color:#edbd4c}dialog{border:0;border-radius:12px;padding:22px;box-shadow:0 15px 50px #0004;width:min(520px,90vw)}form label{display:block;margin:10px 0 4px;font-weight:600}form input,form select{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.error{color:#a82d3a}.muted{color:#6b7280}
</style></head><body><div id="nav-placeholder"></div>
<header><div><h1>Hero Images</h1><p class="note">Applies to newly generated programs and bonus days. Existing programs keep their current image.</p></div><div><input id="token" type="password" placeholder="Internal token" autocomplete="off"> <button class="secondary" id="saveToken">Save token</button> <button class="secondary" id="syncBtn">Sync All to Flyway</button> <button id="promoteAll">Promote all</button> <button id="newBtn">New mapping</button></div></header>
<div id="sync" class="card">Checking seed snapshot…</div>
<section class="card"><h2>Coverage</h2><div class="matrix" id="coverage">Loading…</div></section>
<section class="card"><div class="toolbar"><h2>Mappings</h2><div><select id="scopeFilter"><option value="">All scopes</option><option>program</option><option>program_day</option></select> <select id="statusFilter"><option value="">All files</option><option>found</option><option>missing</option><option>case_mismatch</option></select></div></div><div id="rows">Loading…</div></section>
<dialog id="editor"><form id="form"><h2 id="formTitle">Mapping</h2><input type="hidden" id="rowId"><label>Scope</label><select id="scope"><option>program</option><option>program_day</option></select><label>Program type</label><select id="dayType"></select><label>Focus</label><select id="focus"><option value="">None</option></select><label>Label</label><input id="label" required><label>Sort order</label><input id="sortOrder" type="number" value="0"><label>Existing image key</label><input id="imageKey" placeholder="program_day/example.png"><label>Or upload image</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><p id="formError" class="error"></p><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button id="save">Save</button></div></form></dialog>
<script src="/admin/nav.js"></script><script>
let token=localStorage.getItem('internalToken')||localStorage.getItem('adminToken')||'';document.querySelector('#token').value=token;let list=[],coverage=null;
async function apiFetch(path,options={}){const headers={...(options.headers||{})};if(token)headers['X-Internal-Token']=token;const r=await fetch('/admin'+path,{...options,headers});const body=await r.json().catch(()=>({}));if(!r.ok)throw new Error(body.error||('Request failed: '+r.status));return body}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cell(c){if(!c?.row)return '<span class="badge none">none</span>';return `<div class="cell"><img class="thumb" src="${esc(c.row.imageUrl)}" alt=""><br><span class="badge ${c.method}">${esc(c.method)}</span><br><small>${esc(c.row.label)}</small></div>`}
function renderCoverage(){const focuses=coverage.focuses;document.querySelector('#coverage').innerHTML=`<table><thead><tr><th>Program type</th><th>Program</th>${focuses.map(f=>`<th>${esc(labelFocus(f))}</th>`).join('')}</tr></thead><tbody>${coverage.matrix.map(r=>`<tr><th>${esc(r.programTypeLabel)}</th><td>${cell(r.program)}</td>${r.focuses.map(cell).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function labelFocus(s){return s.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
function renderRows(){const scope=document.querySelector('#scopeFilter').value,status=document.querySelector('#statusFilter').value;const rows=list.filter(r=>(!scope||r.usageScope===scope)&&(!status||r.fileStatus===status));document.querySelector('#rows').innerHTML=`<table><thead><tr><th>Image</th><th>Mapping</th><th>File</th><th>Promoted</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.isActive?'':'inactive'}"><td><img class="thumb" src="${esc(r.imageUrl)}" alt=""></td><td><b>${esc(r.label)}</b><br><span class="muted">${esc(r.usageScope)} · ${esc(r.dayTypeLabel)}${r.focusType?' · '+esc(r.focusTypeLabel):''}</span></td><td><span class="badge ${r.fileStatus}">${esc(r.fileStatus)}</span><br><small>${esc(r.imageKey)}</small></td><td>${r.promotedAt?new Date(r.promotedAt).toLocaleString():'Never'}${r.changedSincePromotion?' · changed':''}</td><td><button onclick="editRow('${r.id}')">Edit</button> <button class="secondary" onclick="toggleRow('${r.id}',${r.isActive})">${r.isActive?'Deactivate':'Restore'}</button> <button class="secondary" onclick="promote('${r.id}')">Promote</button></td></tr>`).join('')}</tbody></table>`}
async function load(){const [l,c]=await Promise.all([apiFetch('/hero-media/list'),apiFetch('/hero-media/coverage')]);list=l.rows;coverage=c;const types=[...new Set([...c.programTypes,'generic'])],focuses=c.focuses;dayType.innerHTML=types.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');focus.innerHTML='<option value="">None</option>'+focuses.map(x=>`<option value="${esc(x)}">${esc(labelFocus(x))}</option>`).join('');renderCoverage();renderRows()}
async function syncStatus(){try{const s=await apiFetch('/sync-status');sync.className='card '+(s.dirty?'dirty':'');sync.textContent=s.message}catch(e){sync.textContent=e.message}}
window.editRow=id=>{const r=list.find(x=>String(x.id)===String(id));rowId.value=r.id;scope.value=r.usageScope;dayType.value=r.dayType;focus.value=r.focusType||'';label.value=r.label;sortOrder.value=r.sortOrder;imageKey.value=r.imageKey;formTitle.textContent='Edit mapping';editor.showModal()};
window.toggleRow=async(id,active)=>{await apiFetch('/hero-media/'+id+(active?'':'/restore'),{method:active?'DELETE':'POST'});await load()};window.promote=async id=>{await apiFetch('/hero-media/'+id+'/promote',{method:'POST'});await load()};
newBtn.onclick=()=>{form.reset();rowId.value='';formTitle.textContent='New mapping';editor.showModal()};cancel.onclick=()=>editor.close();scopeFilter.onchange=statusFilter.onchange=renderRows;
form.onsubmit=async e=>{e.preventDefault();formError.textContent='';try{const id=rowId.value,payload={usageScope:scope.value,dayType:dayType.value,focusType:focus.value||null,label:label.value,sortOrder:Number(sortOrder.value),imageKey:imageKey.value};let saved;if(id)saved=await apiFetch('/hero-media/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});else saved=await apiFetch('/hero-media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(image.files[0]){const fd=new FormData();fd.append('image',image.files[0]);fd.append('label',label.value);await apiFetch('/hero-media/'+saved.row.id+'/image',{method:'POST',body:fd})}editor.close();await load()}catch(err){formError.textContent=err.message}};
saveToken.onclick=()=>{token=document.querySelector('#token').value.trim();localStorage.setItem('internalToken',token);load().catch(e=>rows.textContent=e.message);syncStatus()};promoteAll.onclick=async()=>{await apiFetch('/hero-media/promote-all',{method:'POST'});await load()};syncBtn.onclick=async()=>{await apiFetch('/sync-all-to-flyway',{method:'POST'});await syncStatus()};load().catch(e=>rows.textContent=e.message);syncStatus();
</script></body></html>
