<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HYROX Test Harness</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --panel: #ffffff;
        --border: #d8dee6;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #0f62fe;
        --danger: #dc3545;
        --ok: #0f766e;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: Segoe UI, Arial, sans-serif; }
      .page { padding: 14px; max-width: 1180px; }
      .header, .section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
      .title { margin: 0; font-size: 22px; }
      .controls { display: grid; gap: 12px; }
      .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
      .control { display: grid; gap: 4px; min-width: 260px; flex: 1; }
      .control label { font-size: 12px; color: var(--muted); }
      input, textarea, button { font: inherit; }
      input, textarea { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; width: 100%; }
      textarea { min-height: 120px; resize: vertical; line-height: 1.4; font-family: Consolas, monospace; font-size: 13px; }
      button { border: 1px solid var(--primary); border-radius: 6px; background: var(--primary); color: #fff; padding: 8px 12px; cursor: pointer; min-height: 38px; }
      button.secondary { background: #fff; color: var(--primary); }
      button.danger { border-color: var(--danger); background: #fff; color: var(--danger); }
      button:disabled { opacity: 0.5; cursor: default; }
      .status { margin-top: 8px; font-size: 13px; min-height: 18px; }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--danger); }
      .storage-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
      .storage-tools button { min-height: 30px; padding: 4px 8px; font-size: 12px; }
      .download-panel { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .filename { color: var(--muted); font-size: 13px; font-family: Consolas, monospace; overflow-wrap: anywhere; }
      .preview-panel { display: grid; gap: 14px; }
      .preview-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
      .preview-title { margin: 0; font-size: 18px; }
      .preview-grid { display: grid; gap: 14px; }
      .preview-case { border-top: 1px solid var(--border); padding-top: 12px; display: grid; gap: 12px; }
      .preview-case:first-child { border-top: 0; padding-top: 0; }
      .preview-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
      .mode-preview { display: grid; gap: 8px; }
      .mode-preview h3 { margin: 0; font-size: 15px; }
      .email-subject { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; background: #f9fafb; font-weight: 600; }
      .email-frame { width: 100%; min-height: 720px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
      .carousel-frame { width: 100%; height: 860px; border: 1px solid var(--border); border-radius: 6px; background: #111; }
      .empty-preview { color: var(--muted); font-style: italic; }
      .test-list { display: grid; gap: 8px; }
      .test-case {
        display: flex;
        flex-direction: column;
        gap: 8px;
        border: 1px solid #ecf0f4;
        border-radius: 6px;
        padding: 8px 10px;
      }
      .test-case-main {
        display: grid;
        grid-template-columns: 42px minmax(260px, 1.5fr) 150px minmax(130px, .55fr) 110px minmax(330px, auto);
        gap: 10px;
        align-items: end;
      }
      .test-case-annotations {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 10px;
        padding-left: 52px;
      }
      .case-commentary-input {
        min-height: 56px;
        resize: vertical;
        font-size: 12px;
        line-height: 1.4;
        font-family: Segoe UI, Arial, sans-serif;
      }
      .case-number { color: var(--muted); font-size: 12px; padding-bottom: 9px; }
      .field { display: grid; gap: 3px; min-width: 0; }
      .field label, .metric-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
      .field input { font-family: Consolas, monospace; font-size: 12px; }
      .metric-value { color: var(--text); font-size: 13px; font-weight: 600; padding-bottom: 9px; overflow-wrap: anywhere; }
      .metric-value.muted { color: var(--muted); font-weight: 400; }
      .case-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-bottom: 0; }
      .case-actions button { min-height: 34px; padding: 6px 9px; }
      .empty { color: var(--muted); font-style: italic; font-size: 13px; }
      @media (max-width: 980px) {
        .test-case-main { grid-template-columns: 1fr; align-items: stretch; }
        .test-case-annotations { grid-template-columns: 1fr; padding-left: 0; }
        .case-number, .metric-value { padding-bottom: 0; }
      }
    </style>
  </head>
  <body>
    <div id="nav-placeholder"></div>
    <div class="page">
      <section class="header">
        <div class="top-row">
          <h1 class="title">HYROX Test Harness</h1>
        </div>
        <form id="harness-form" class="controls">
          <div class="row">
            <div class="control">
              <label for="token-input">Internal API Token</label>
              <input id="token-input" type="password" autocomplete="off" placeholder="Paste x-internal-token" />
            </div>
          </div>
          <div class="row">
            <div class="control">
              <label for="paste-input">Paste URLs</label>
              <textarea id="paste-input" placeholder="Paste one HYROX results URL per line"></textarea>
            </div>
          </div>
          <div class="row">
            <button id="add-pasted-btn" class="secondary" type="button">Add Pasted URLs</button>
            <button id="add-row-btn" class="secondary" type="button">Add Empty Row</button>
            <button id="import-metadata-btn" class="secondary" type="button">Import Case Metadata</button>
            <button id="generate-pack-btn" type="submit">Generate Test Pack</button>
            <button id="generate-first-btn" class="secondary" type="button">Generate First Row</button>
            <button id="generate-emails-btn" class="secondary" type="button">Generate All Emails</button>
            <button id="download-email-html-btn" class="secondary" type="button">Download All Email HTML</button>
            <button id="generate-instagram-btn" class="secondary" type="button">Generate All Instagram Packs</button>
            <button id="preview-emails-btn" class="secondary" type="button">Preview All Emails</button>
            <button id="preview-instagram-btn" class="secondary" type="button">Preview All Instagram</button>
            <button id="generate-race-cards-btn" class="secondary" type="button">Generate All Race Cards</button>
          </div>
          <div class="storage-tools">
            <span id="storage-summary"></span>
            <button id="export-cases-btn" class="secondary" type="button">Export Cases</button>
            <button id="import-cases-btn" class="secondary" type="button">Import Cases</button>
            <button id="restore-backup-btn" class="secondary" type="button" hidden>Restore Last Backup</button>
            <input id="import-cases-file" type="file" accept="application/json,.json" hidden />
          </div>
        </form>
        <div id="main-status" class="status"></div>
      </section>

      <section class="section">
        <div id="test-list" class="test-list">
          <div class="empty">Paste URLs to build a test list.</div>
        </div>
      </section>

      <section class="section">
        <div class="download-panel">
          <button id="download-btn" class="secondary" type="button" hidden>Download Generated File</button>
          <span id="filename" class="filename"></span>
        </div>
      </section>

      <section id="preview-section" class="section" hidden>
        <div class="preview-panel">
          <div class="preview-toolbar">
            <h2 id="preview-title" class="preview-title">Preview</h2>
            <button id="clear-preview-btn" class="secondary" type="button">Clear Preview</button>
          </div>
          <div id="preview-content" class="preview-grid"></div>
        </div>
      </section>
    </div>

    <script type="module">
      const STORAGE_KEY = "admin_internal_api_token";
      const METADATA_STORAGE_KEY = "hyrox_test_harness_case_metadata_v1";
      const CASES_STORAGE_KEY = "hyrox_test_harness_cases_v1";
      const CASES_BACKUP_STORAGE_KEY = "hyrox_test_harness_cases_backup_v1";

      const form = document.getElementById("harness-form");
      const tokenInput = document.getElementById("token-input");
      const pasteInput = document.getElementById("paste-input");
      const addPastedBtn = document.getElementById("add-pasted-btn");
      const addRowBtn = document.getElementById("add-row-btn");
      const importMetadataBtn = document.getElementById("import-metadata-btn");
      const generatePackBtn = document.getElementById("generate-pack-btn");
      const generateFirstBtn = document.getElementById("generate-first-btn");
      const generateEmailsBtn = document.getElementById("generate-emails-btn");
      const downloadEmailHtmlBtn = document.getElementById("download-email-html-btn");
      const generateInstagramBtn = document.getElementById("generate-instagram-btn");
      const previewEmailsBtn = document.getElementById("preview-emails-btn");
      const previewInstagramBtn = document.getElementById("preview-instagram-btn");
      const generateRaceCardsBtn = document.getElementById("generate-race-cards-btn");
      const exportCasesBtn = document.getElementById("export-cases-btn");
      const importCasesBtn = document.getElementById("import-cases-btn");
      const importCasesFile = document.getElementById("import-cases-file");
      const restoreBackupBtn = document.getElementById("restore-backup-btn");
      const storageSummary = document.getElementById("storage-summary");
      const downloadBtn = document.getElementById("download-btn");
      const statusEl = document.getElementById("main-status");
      const filenameEl = document.getElementById("filename");
      const testListEl = document.getElementById("test-list");
      const previewSection = document.getElementById("preview-section");
      const previewTitle = document.getElementById("preview-title");
      const previewContent = document.getElementById("preview-content");
      const clearPreviewBtn = document.getElementById("clear-preview-btn");

      let currentDownloadUrl = "";
      let currentFilename = "";
      let previewFrameUrls = [];
      let metadataCache = loadJson(METADATA_STORAGE_KEY, {});
      let cases = loadJson(CASES_STORAGE_KEY, []);
      let lastPersistedCasesJson = JSON.stringify(cases);

      const savedToken = sessionStorage.getItem(STORAGE_KEY);
      if (savedToken) tokenInput.value = savedToken;

      function loadJson(key, fallback) {
        try {
          const parsed = JSON.parse(localStorage.getItem(key) || "null");
          return parsed ?? fallback;
        } catch {
          return fallback;
        }
      }

      function saveJson(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function backupPayload() {
        return loadJson(CASES_BACKUP_STORAGE_KEY, null);
      }

      function backupCases(previousCases) {
        const rows = Array.isArray(previousCases) ? previousCases : [];
        if (!rows.length) return;
        saveJson(CASES_BACKUP_STORAGE_KEY, {
          savedAt: new Date().toISOString(),
          origin: window.location.origin,
          cases: rows,
        });
      }

      function updateStorageSummary() {
        const backup = backupPayload();
        const backupCount = Array.isArray(backup?.cases) ? backup.cases.length : 0;
        const backupText = backupCount ? ` Last backup: ${backupCount} case(s).` : "";
        storageSummary.textContent = `Saved on ${window.location.origin}: ${cases.length} case(s).${backupText}`;
        restoreBackupBtn.hidden = backupCount === 0;
      }

      function setStatus(message, kind = "") {
        statusEl.textContent = message;
        statusEl.className = `status ${kind}`;
      }

      function resetDownload() {
        if (currentDownloadUrl) URL.revokeObjectURL(currentDownloadUrl);
        currentDownloadUrl = "";
        currentFilename = "";
        downloadBtn.hidden = true;
        filenameEl.textContent = "";
      }

      function clearPreviewFrameUrls() {
        for (const url of previewFrameUrls) URL.revokeObjectURL(url);
        previewFrameUrls = [];
      }

      function emailPreviewUrl(html) {
        const blob = new Blob([String(html ?? "")], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        previewFrameUrls.push(url);
        return url;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function pastedUrls() {
        return [...new Set(pasteInput.value
          .split(/\r?\n/)
          .map((url) => url.trim())
          .filter(Boolean))];
      }

      function cleanCases() {
        const seen = new Set();
        return cases
          .map((entry) => ({
            url: String(entry.url ?? "").trim(),
            targetTime: String(entry.targetTime ?? "").trim(),
            label: String(entry.label ?? "").trim(),
            expectedCommentary: String(entry.expectedCommentary ?? ""),
          }))
          .filter((entry) => {
            if (!entry.url) return true;
            if (seen.has(entry.url)) return false;
            seen.add(entry.url);
            return true;
          });
      }

      function runnableCases(selected = cases) {
        return selected
          .map((entry) => ({
            url: String(entry.url ?? "").trim(),
            targetTime: String(entry.targetTime ?? "").trim(),
            label: String(entry.label ?? "").trim(),
            expectedCommentary: String(entry.expectedCommentary ?? ""),
          }))
          .filter((entry) => entry.url || entry.targetTime);
      }

      function parseTargetSeconds(raw) {
        const value = String(raw ?? "").trim();
        if (!value) return null;
        if (/^\d+$/.test(value)) return Number(value);
        const parts = value.split(":").map((part) => Number(part));
        if (parts.some((part) => !Number.isFinite(part) || part < 0)) return null;
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        return null;
      }

      function formatSeconds(seconds) {
        if (!Number.isFinite(seconds)) return "-";
        const value = Math.max(0, Math.round(seconds));
        const h = Math.floor(value / 3600);
        const m = Math.floor((value % 3600) / 60);
        const s = value % 60;
        if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        return `${m}:${String(s).padStart(2, "0")}`;
      }

      function targetLabel(targetTime) {
        return formatSeconds(parseTargetSeconds(targetTime));
      }

      function persistCases() {
        const previousCases = loadJson(CASES_STORAGE_KEY, []);
        cases = cleanCases();
        if (previousCases.length && JSON.stringify(previousCases) !== JSON.stringify(cases)) {
          backupCases(previousCases);
        }
        saveJson(CASES_STORAGE_KEY, cases);
        lastPersistedCasesJson = JSON.stringify(cases);
        updateStorageSummary();
      }

      function exportCases() {
        const payload = {
          exportedAt: new Date().toISOString(),
          origin: window.location.origin,
          cases,
          metadata: metadataCache,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "hyrox-test-harness-cases.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function loadImportedCases(payload) {
        const importedCases = Array.isArray(payload) ? payload : payload?.cases;
        if (!Array.isArray(importedCases)) throw new Error("Import file does not contain a cases array.");
        backupCases(cases);
        cases = importedCases.map((entry) => ({
          url: String(entry?.url ?? "").trim(),
          targetTime: String(entry?.targetTime ?? "").trim(),
          label: String(entry?.label ?? "").trim(),
          expectedCommentary: String(entry?.expectedCommentary ?? ""),
        })).filter((entry) => entry.url || entry.targetTime);
        if (payload?.metadata && typeof payload.metadata === "object") {
          metadataCache = { ...metadataCache, ...payload.metadata };
          saveJson(METADATA_STORAGE_KEY, metadataCache);
        }
        persistCases();
        renderTestList();
        setStatus(`Imported ${cases.length} case(s).`, "ok");
      }

      function restoreBackup() {
        const backup = backupPayload();
        if (!Array.isArray(backup?.cases) || !backup.cases.length) {
          setStatus("No case backup found for this browser origin.", "err");
          return;
        }
        backupCases(cases);
        cases = backup.cases;
        persistCases();
        renderTestList();
        setStatus(`Restored ${cases.length} case(s) from backup.`, "ok");
      }

      function addPastedUrls() {
        const urls = pastedUrls();
        if (!urls.length) {
          setStatus("Paste one or more URLs first.", "err");
          return;
        }
        const existing = new Set(cases.map((entry) => entry.url).filter(Boolean));
        for (const url of urls) {
          if (!existing.has(url)) cases.push({ url, targetTime: "", label: "", expectedCommentary: "" });
          existing.add(url);
        }
        pasteInput.value = "";
        persistCases();
        renderTestList();
        setStatus(`Added ${urls.length} pasted URL(s).`, "ok");
      }

      function renderTestList() {
        const currentJson = JSON.stringify(cases);
        if (currentJson !== lastPersistedCasesJson) persistCases();
        else updateStorageSummary();
        if (!cases.length) {
          testListEl.innerHTML = '<div class="empty">Paste URLs to build a test list.</div>';
          return;
        }

        testListEl.innerHTML = cases.map((entry, index) => {
          const meta = metadataCache[entry.url] ?? {};
          return `
            <div class="test-case" data-index="${index}">
              <div class="test-case-main">
                <div class="case-number">Case ${index + 1}</div>
                <div class="field">
                  <label for="case-url-${index}">HYROX Results URL</label>
                  <input id="case-url-${index}" class="case-url-input" data-index="${index}" type="url" value="${escapeHtml(entry.url)}" placeholder="https://results.hyrox.com/..." />
                </div>
                <div class="field">
                  <label for="case-target-${index}">Target Time</label>
                  <input id="case-target-${index}" class="case-target-input" data-index="${index}" type="text" value="${escapeHtml(entry.targetTime)}" placeholder="59:59 or 3599" />
                </div>
                <div>
                  <div class="metric-label">Athlete</div>
                  <div class="metric-value">${escapeHtml(meta.athleteName || "Not imported")}</div>
                </div>
                <div>
                  <div class="metric-label">HYROX Time</div>
                  <div class="metric-value">${escapeHtml(meta.finishTimeFormatted || "-")}</div>
                </div>
                <div class="case-actions">
                  <button class="secondary run-one-btn" type="button" data-index="${index}">QA</button>
                  <button class="secondary email-one-btn" type="button" data-index="${index}">Email</button>
                  <button class="secondary instagram-one-btn" type="button" data-index="${index}">Instagram</button>
                  <button class="secondary preview-email-one-btn" type="button" data-index="${index}">View Email</button>
                  <button class="secondary preview-instagram-one-btn" type="button" data-index="${index}">View Insta</button>
                  <button class="secondary race-card-one-btn" type="button" data-index="${index}" title="Generate race card PNG for this case">Race Card</button>
                  <button class="secondary suggest-one-btn" type="button" data-index="${index}" title="Auto-fill label and commentary by running analysis">Suggest</button>
                  <button class="danger remove-row-btn" type="button" data-index="${index}">Remove</button>
                </div>
              </div>
              <div class="test-case-annotations">
                <div class="field">
                  <label for="case-label-${index}">Label</label>
                  <input id="case-label-${index}" class="case-label-input" data-index="${index}" type="text" value="${escapeHtml(entry.label ?? "")}" placeholder="e.g. RoxZone main limiter" />
                </div>
                <div class="field">
                  <label for="case-commentary-${index}">Expected Commentary</label>
                  <textarea id="case-commentary-${index}" class="case-commentary-input" data-index="${index}" placeholder="What should the engine say for this case?">${escapeHtml(entry.expectedCommentary ?? "")}</textarea>
                </div>
              </div>
            </div>
          `;
        }).join("");
      }

      function updateCaseFromInput(input) {
        const index = Number(input.dataset.index);
        if (!Number.isInteger(index) || !cases[index]) return;
        if (input.classList.contains("case-url-input")) cases[index].url = input.value.trim();
        if (input.classList.contains("case-target-input")) cases[index].targetTime = input.value.trim();
        if (input.classList.contains("case-label-input")) cases[index].label = input.value.trim();
        if (input.classList.contains("case-commentary-input")) cases[index].expectedCommentary = input.value;
        persistCases();
      }

      function filenameFromDisposition(value) {
        const match = /filename\*?=(?:UTF-8''|")?([^";]+)/i.exec(value || "");
        return match ? decodeURIComponent(match[1].replaceAll('"', "")) : "hyrox-harness.md";
      }

      async function readError(response) {
        const text = await response.text().catch(() => "");
        if (!text) return `HTTP ${response.status}`;
        try {
          const data = JSON.parse(text);
          return data.reason ? `${data.error}: ${data.reason}` : data.error || text;
        } catch {
          return text;
        }
      }

      function setBusy(busy) {
        importMetadataBtn.disabled = busy;
        generatePackBtn.disabled = busy;
        generateFirstBtn.disabled = busy;
        generateEmailsBtn.disabled = busy;
        downloadEmailHtmlBtn.disabled = busy;
        generateInstagramBtn.disabled = busy;
        previewEmailsBtn.disabled = busy;
        previewInstagramBtn.disabled = busy;
        generateRaceCardsBtn.disabled = busy;
        exportCasesBtn.disabled = busy;
        importCasesBtn.disabled = busy;
        restoreBackupBtn.disabled = busy;
        clearPreviewBtn.disabled = busy;
        addPastedBtn.disabled = busy;
        addRowBtn.disabled = busy;
        testListEl.querySelectorAll("button,input").forEach((el) => { el.disabled = busy; });
      }

      function validateCases(selected) {
        if (!selected.length) return "Add at least one test case.";
        for (let i = 0; i < selected.length; i++) {
          const entry = selected[i];
          const caseLabel = `Case ${i + 1}`;
          if (!entry.url) return `${caseLabel}: add a HYROX results URL.`;
          if (!entry.targetTime) return `${caseLabel}: add a target time.`;
          const secs = parseTargetSeconds(entry.targetTime);
          if (!Number.isFinite(secs) || secs <= 0) return `${caseLabel}: target time "${entry.targetTime}" is not valid — use 59:59, 1:15:00, or total seconds.`;
          if (secs > 10800) return `${caseLabel}: target time "${entry.targetTime}" (${secs}s) must be under 3 hours.`;
        }
        return null;
      }

      function artifactLabel(artifact) {
        if (artifact === "email") return "email artifact";
        if (artifact === "email_html") return "email HTML ZIP";
        if (artifact === "instagram") return "Instagram pack";
        return "QA markdown";
      }

      function downloadCurrentArtifact() {
        if (!currentDownloadUrl) return;
        const link = document.createElement("a");
        link.href = currentDownloadUrl;
        link.download = currentFilename || "hyrox-harness.md";
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      async function generateMarkdown(selectedCases, artifact = "qa") {
        resetDownload();
        const token = tokenInput.value.trim();
        const selected = runnableCases(selectedCases);
        const validationError = validateCases(selected);
        if (!token) { setStatus("Paste your x-internal-token first.", "err"); return; }
        if (validationError) { setStatus(validationError, "err"); return; }

        sessionStorage.setItem(STORAGE_KEY, token);
        setBusy(true);
        const label = artifactLabel(artifact);
        setStatus(selected.length > 1 ? `Generating ${selected.length}-case ${label}...` : `Generating ${label}...`);

        try {
          const response = await fetch("/api/admin/hyrox/test-harness", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-internal-token": token,
            },
            body: JSON.stringify(selected.length > 1 ? { cases: selected, artifact } : { ...selected[0], artifact }),
          });

          if (!response.ok) throw new Error(await readError(response));

          const blob = await response.blob();
          currentDownloadUrl = URL.createObjectURL(blob);
          currentFilename = filenameFromDisposition(response.headers.get("Content-Disposition"));
          downloadBtn.hidden = false;
          downloadBtn.textContent = artifact === "email_html"
            ? "Download Email HTML ZIP"
            : artifact === "email"
              ? "Download Email Markdown"
              : artifact === "instagram"
                ? "Download Instagram Markdown"
                : "Download QA Markdown";
          filenameEl.textContent = currentFilename;
          if (artifact === "email_html") downloadCurrentArtifact();
          setStatus(selected.length > 1 ? `${label} generated for all cases.` : `${label} generated.`, "ok");
        } catch (error) {
          setStatus(error.message || "Generation failed", "err");
        } finally {
          setBusy(false);
        }
      }

      function renderEmailPreview(data) {
        clearPreviewFrameUrls();
        previewTitle.textContent = "Email Preview";
        previewContent.innerHTML = (data.cases || []).map((testCase) => {
          if (!testCase.ok) {
            return `<article class="preview-case"><h3>${escapeHtml(testCase.url)}</h3><div class="status err">${escapeHtml(testCase.reason)}</div></article>`;
          }
          return `
            <article class="preview-case">
              <div>
                <h3>${escapeHtml(testCase.athleteName || "HYROX athlete")}</h3>
                <div class="preview-meta">
                  <span>HYROX ${escapeHtml(testCase.finishTimeFormatted || "-")}</span>
                  <span>Target ${escapeHtml(testCase.targetTimeFormatted || "-")}</span>
                  <span>${escapeHtml(testCase.url)}</span>
                </div>
              </div>
              ${testCase.modes.map((mode) => mode.ok ? `
                <section class="mode-preview">
                  <h3>${escapeHtml(mode.modeName)}</h3>
                  <div class="email-subject">${escapeHtml(mode.emailSubject || "(no subject)")}</div>
                  ${mode.emailHtml
                    ? `<iframe class="email-frame" sandbox src="${emailPreviewUrl(mode.emailHtml)}"></iframe>`
                    : '<div class="empty-preview">No email HTML generated for this mode.</div>'}
                </section>
              ` : `
                <section class="mode-preview">
                  <h3>${escapeHtml(mode.modeName)}</h3>
                  <div class="status err">${escapeHtml(mode.error)}</div>
                </section>
              `).join("")}
            </article>
          `;
        }).join("");
        previewSection.hidden = false;
        previewSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function renderInstagramPreview(data) {
        clearPreviewFrameUrls();
        previewTitle.textContent = "Instagram Preview";
        previewContent.innerHTML = (data.cases || []).map((testCase) => {
          if (!testCase.ok) {
            return `<article class="preview-case"><h3>${escapeHtml(testCase.url)}</h3><div class="status err">${escapeHtml(testCase.reason)}</div></article>`;
          }
          return `
            <article class="preview-case">
              <div>
                <h3>${escapeHtml(testCase.athleteName || "HYROX athlete")}</h3>
                <div class="preview-meta">
                  <span>HYROX ${escapeHtml(testCase.finishTimeFormatted || "-")}</span>
                  <span>Target ${escapeHtml(testCase.targetTimeFormatted || "-")}</span>
                  <span>${escapeHtml(testCase.url)}</span>
                </div>
              </div>
              ${testCase.modes.map((mode) => mode.ok ? `
                <section class="mode-preview">
                  <h3>${escapeHtml(mode.modeName)}</h3>
                  ${mode.carouselHtml
                    ? `<iframe class="carousel-frame" src="${emailPreviewUrl(mode.carouselHtml)}"></iframe>`
                    : '<div class="empty-preview">No carousel HTML generated for this mode.</div>'}
                </section>
              ` : `
                <section class="mode-preview">
                  <h3>${escapeHtml(mode.modeName)}</h3>
                  <div class="status err">${escapeHtml(mode.error)}</div>
                </section>
              `).join("")}
            </article>
          `;
        }).join("");
        previewSection.hidden = false;
        previewSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      async function previewOutput(selectedCases, type) {
        const token = tokenInput.value.trim();
        const selected = runnableCases(selectedCases);
        const validationError = validateCases(selected);
        if (!token) { setStatus("Paste your x-internal-token first.", "err"); return; }
        if (validationError) { setStatus(validationError, "err"); return; }

        sessionStorage.setItem(STORAGE_KEY, token);
        setBusy(true);
        setStatus(selected.length > 1 ? `Rendering ${selected.length} ${type} previews...` : `Rendering ${type} preview...`);

        try {
          const response = await fetch("/api/admin/hyrox/test-harness", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-internal-token": token,
            },
            body: JSON.stringify(selected.length > 1 ? { cases: selected, preview: true } : { ...selected[0], preview: true }),
          });

          if (!response.ok) throw new Error(await readError(response));
          const data = await response.json();
          if (type === "email") renderEmailPreview(data);
          if (type === "instagram") renderInstagramPreview(data);
          setStatus(`${type === "email" ? "Email" : "Instagram"} preview rendered.`, "ok");
        } catch (error) {
          setStatus(error.message || "Preview failed", "err");
        } finally {
          setBusy(false);
        }
      }

      async function importMetadata() {
        const token = tokenInput.value.trim();
        const selected = runnableCases(cases).filter((entry) => entry.url);
        if (!token) { setStatus("Paste your x-internal-token first.", "err"); return; }
        if (!selected.length) { setStatus("Add at least one HYROX results URL.", "err"); return; }

        sessionStorage.setItem(STORAGE_KEY, token);
        setBusy(true);
        setStatus(`Importing metadata for ${selected.length} case(s)...`);

        try {
          const response = await fetch("/api/admin/hyrox/test-harness/metadata", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-internal-token": token,
            },
            body: JSON.stringify(selected.length > 1 ? { cases: selected } : { url: selected[0].url }),
          });

          if (!response.ok) throw new Error(await readError(response));
          const data = await response.json();
          let imported = 0;
          for (const item of data.cases || []) {
            if (!item.ok) continue;
            metadataCache[item.url] = {
              athleteName: item.athleteName,
              division: item.division,
              raceName: item.raceName,
              eventDate: item.eventDate,
              finishTimeSeconds: item.finishTimeSeconds,
              finishTimeFormatted: item.finishTimeFormatted,
              splitCount: item.splitCount,
              confidence: item.confidence,
              importedAt: new Date().toISOString(),
            };
            imported += 1;
          }
          saveJson(METADATA_STORAGE_KEY, metadataCache);
          renderTestList();
          const failed = (data.cases || []).length - imported;
          setStatus(failed ? `Imported ${imported}; ${failed} failed.` : `Imported ${imported} case(s).`, failed ? "err" : "ok");
        } catch (error) {
          setStatus(error.message || "Metadata import failed", "err");
        } finally {
          setBusy(false);
        }
      }

      async function suggestCommentary(index) {
        const entry = cases[index];
        if (!entry?.url) { setStatus("No URL for this case.", "err"); return; }
        if (!entry.targetTime) { setStatus(`Add a target time to case ${index + 1} before suggesting.`, "err"); return; }
        const token = tokenInput.value.trim();
        if (!token) { setStatus("Paste your x-internal-token first.", "err"); return; }

        sessionStorage.setItem(STORAGE_KEY, token);
        setBusy(true);
        setStatus(`Analysing case ${index + 1} to generate suggestion…`);

        try {
          const response = await fetch("/api/admin/hyrox/test-harness/suggest", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-internal-token": token },
            body: JSON.stringify({ url: entry.url, targetTime: entry.targetTime }),
          });

          if (!response.ok) throw new Error(await readError(response));
          const data = await response.json();

          if (data.label) {
            cases[index].label = data.label;
            const labelInput = testListEl.querySelector(`.case-label-input[data-index="${index}"]`);
            if (labelInput) labelInput.value = data.label;
          }
          if (data.expectedCommentary) {
            cases[index].expectedCommentary = data.expectedCommentary;
            const commentaryInput = testListEl.querySelector(`.case-commentary-input[data-index="${index}"]`);
            if (commentaryInput) commentaryInput.value = data.expectedCommentary;
          }

          persistCases();
          setStatus(`Suggestion applied for case ${index + 1}. Edit as needed.`, "ok");
        } catch (error) {
          setStatus(error.message || "Suggest failed", "err");
        } finally {
          setBusy(false);
        }
      }

      downloadBtn.addEventListener("click", () => {
        downloadCurrentArtifact();
      });

      exportCasesBtn.addEventListener("click", exportCases);
      importCasesBtn.addEventListener("click", () => importCasesFile.click());
      importCasesFile.addEventListener("change", async () => {
        const file = importCasesFile.files?.[0];
        importCasesFile.value = "";
        if (!file) return;
        try {
          loadImportedCases(JSON.parse(await file.text()));
        } catch (error) {
          setStatus(error.message || "Could not import cases.", "err");
        }
      });
      restoreBackupBtn.addEventListener("click", restoreBackup);
      addPastedBtn.addEventListener("click", addPastedUrls);
      addRowBtn.addEventListener("click", () => {
        cases.push({ url: "", targetTime: "", label: "", expectedCommentary: "" });
        persistCases();
        renderTestList();
      });
      async function generateRaceCardForCase(entry, triggerBtn) {
        if (!entry?.url) { setStatus("No URL for this case.", "err"); return; }
        const token = tokenInput.value.trim();
        const originalText = triggerBtn?.textContent;
        if (triggerBtn) { triggerBtn.disabled = true; triggerBtn.textContent = "Generating…"; }
        setStatus("Generating race card…");
        try {
          const body = { url: entry.url };
          if (entry.targetTime) body.targetTime = entry.targetTime;
          const resp = await fetch("/api/admin/hyrox/test-harness/race-card-url", {
            method: "POST",
            headers: { "Content-Type": "application/json", ...(token ? { "x-internal-token": token } : {}) },
            body: JSON.stringify({ cases: [body] }),
          });
          if (!resp.ok) {
            const errText = await resp.text().catch(() => "");
            setStatus(`Race card failed: ${errText || resp.status}`, "err");
            return;
          }
          const blob = await resp.blob();
          const url = URL.createObjectURL(blob);
          window.open(url, "_blank");
          setTimeout(() => URL.revokeObjectURL(url), 60000);
          setStatus("Race card opened in new tab.", "ok");
        } catch (err) {
          setStatus(`Race card error: ${err.message}`, "err");
        } finally {
          if (triggerBtn) { triggerBtn.disabled = false; triggerBtn.textContent = originalText; }
        }
      }

      async function generateAllRaceCards(selected) {
        const valid = runnableCases(selected);
        if (!valid.length) { setStatus("No valid cases.", "err"); return; }
        setBusy(true);
        setStatus(`Generating race cards for ${valid.length} case(s)…`);
        let ok = 0; let fail = 0;
        for (const entry of valid) {
          try {
            const token = tokenInput.value.trim();
            const body = { url: entry.url };
            if (entry.targetTime) body.targetTime = entry.targetTime;
            const resp = await fetch("/api/admin/hyrox/test-harness/race-card-url", {
              method: "POST",
              headers: { "Content-Type": "application/json", ...(token ? { "x-internal-token": token } : {}) },
              body: JSON.stringify({ cases: [body] }),
            });
            if (resp.ok) {
              const blob = await resp.blob();
              const blobUrl = URL.createObjectURL(blob);
              window.open(blobUrl, "_blank");
              setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
              ok++;
            } else { fail++; }
          } catch { fail++; }
        }
        setBusy(false);
        setStatus(`Race cards: ${ok} opened, ${fail} failed.`, fail ? "err" : "ok");
      }

      importMetadataBtn.addEventListener("click", importMetadata);
      generateEmailsBtn.addEventListener("click", () => generateMarkdown(cases, "email"));
      downloadEmailHtmlBtn.addEventListener("click", () => generateMarkdown(cases, "email_html"));
      generateInstagramBtn.addEventListener("click", () => generateMarkdown(cases, "instagram"));
      generateRaceCardsBtn.addEventListener("click", () => generateAllRaceCards(cases));
      previewEmailsBtn.addEventListener("click", () => previewOutput(cases, "email"));
      previewInstagramBtn.addEventListener("click", () => previewOutput(cases, "instagram"));
      clearPreviewBtn.addEventListener("click", () => {
        previewSection.hidden = true;
        previewContent.innerHTML = "";
        clearPreviewFrameUrls();
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        generateMarkdown(cases);
      });
      generateFirstBtn.addEventListener("click", () => generateMarkdown(cases.slice(0, 1)));
      testListEl.addEventListener("input", (event) => updateCaseFromInput(event.target));
      testListEl.addEventListener("change", (event) => {
        updateCaseFromInput(event.target);
        if (event.target.classList.contains("case-url-input")) renderTestList();
      });
      testListEl.addEventListener("click", (event) => {
        const runButton = event.target.closest(".run-one-btn");
        if (runButton) {
          const index = Number(runButton.dataset.index);
          generateMarkdown(cases.slice(index, index + 1));
          return;
        }
        const emailButton = event.target.closest(".email-one-btn");
        if (emailButton) {
          const index = Number(emailButton.dataset.index);
          generateMarkdown(cases.slice(index, index + 1), "email");
          return;
        }
        const instagramButton = event.target.closest(".instagram-one-btn");
        if (instagramButton) {
          const index = Number(instagramButton.dataset.index);
          generateMarkdown(cases.slice(index, index + 1), "instagram");
          return;
        }
        const previewEmailButton = event.target.closest(".preview-email-one-btn");
        if (previewEmailButton) {
          const index = Number(previewEmailButton.dataset.index);
          previewOutput(cases.slice(index, index + 1), "email");
          return;
        }
        const previewInstagramButton = event.target.closest(".preview-instagram-one-btn");
        if (previewInstagramButton) {
          const index = Number(previewInstagramButton.dataset.index);
          previewOutput(cases.slice(index, index + 1), "instagram");
          return;
        }
        const raceCardButton = event.target.closest(".race-card-one-btn");
        if (raceCardButton) {
          const index = Number(raceCardButton.dataset.index);
          generateRaceCardForCase(cases[index], raceCardButton);
          return;
        }
        const suggestButton = event.target.closest(".suggest-one-btn");
        if (suggestButton) {
          const index = Number(suggestButton.dataset.index);
          suggestCommentary(index);
          return;
        }
        const removeButton = event.target.closest(".remove-row-btn");
        if (removeButton) {
          const index = Number(removeButton.dataset.index);
          cases.splice(index, 1);
          persistCases();
          renderTestList();
        }
      });
      pasteInput.addEventListener("paste", () => {
        setTimeout(addPastedUrls, 0);
      });

      renderTestList();
      window.addEventListener("beforeunload", resetDownload);
    </script>
    <script src="/admin-ui/nav.js"></script>
  </body>
</html>
