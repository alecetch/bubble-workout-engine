appId: com.bubbleworkout.mobile
---
# Precondition: test account must be logged in. Run 01-auth-login.yaml first.
- launchApp:
    stopApp: false
- runScript:
    file: scripts/post-launch-sleep.js
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - extendedWaitUntil:
          visible: "http://10.0.2.2:8081"
          timeout: 10000
      - tapOn: "http://10.0.2.2:8081"
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 20000
      - tapOn: "Continue"
- tapOn:
    text: "Close"
    optional: true
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 20000
- tapOn:
    id: "Name"
- extendedWaitUntil:
    visible: "Edit Name"
    timeout: 10000
- tapOn:
    id: "account-name-input"
- eraseText
- inputText: "E2E User"
- hideKeyboard
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- assertVisible: "E2E User"
