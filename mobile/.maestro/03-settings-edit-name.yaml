appId: fit.get200days.app
---
# Precondition: test account must be logged in. Run 01-auth-login.yaml first.
- launchApp:
    stopApp: false
- runScript:
    file: scripts/post-launch-sleep.js
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: "http://"
      - inputText: "http://10.0.2.2:8081"
      - tapOn: "Connect"
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 240000
      - tapOn: "Continue"
- tapOn:
    text: "Close"
    optional: true
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 20000
- tapOn: "Name"
- extendedWaitUntil:
    visible: "Edit Name"
    timeout: 10000
- tapOn:
    id: "account-name-input"
# Bounded erase: the field holds the account name ("E2E User" after the first
# run). Erasing the default 50 characters on a slow emulator can outrun
# Maestro's 120s driver deadline.
- eraseText: 30
- inputText: "E2E User"
- hideKeyboard
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- assertVisible: "E2E User"
