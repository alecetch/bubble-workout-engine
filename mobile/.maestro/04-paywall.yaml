appId: fit.get200days.app
---
# Precondition: test account must be logged in.
- launchApp:
    stopApp: false
- runScript:
    file: scripts/post-launch-sleep.js
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: "http://"
      - inputText: "http://10.0.2.2:8081"
      - tapOn: "Connect"
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 240000
      - tapOn: "Continue"
- tapOn:
    text: "Close"
    optional: true
# Refresh the session after the runner expires the account in the database.
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Settings"
      - extendedWaitUntil:
          visible: "Settings"
          timeout: 20000
      - scrollUntilVisible:
          element:
            text: "Log Out"
          direction: DOWN
      - tapOn: "Log Out"
      - extendedWaitUntil:
          visible: "Welcome"
          timeout: 15000
# A retry can relaunch onto the Login screen with the previous attempt's text
# still in the fields. Go back so "Sign in" mounts it again with empty fields;
# that is what lets this flow type without eraseText (see the note below).
- runFlow:
    when:
      visible: "Forgot password?"
    commands:
      - back
      - extendedWaitUntil:
          visible: "Welcome"
          timeout: 30000
- runFlow:
    when:
      visible: "Welcome"
    commands:
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Email"
    timeout: 10000
# No eraseText: the login fields always mount empty. On a struggling CI emulator
# each erased character waits for the UI to go idle, so erasing an empty field
# could outrun Maestro's 120s driver deadline (DEADLINE_EXCEEDED, seen on #518).
- tapOn:
    id: "email-input"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible: "Today"
    timeout: 20000
- assertNotVisible: "Program Review"
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 20000
- tapOn:
    text: "Subscribe"
- extendedWaitUntil:
    visible: "Your trial has ended"
    timeout: 10000
- assertVisible: "Subscribe"
# CI has no store SDK key or offering; subscription loading must fail gracefully.
- extendedWaitUntil:
    visible: "Subscriptions are unavailable right now"
    timeout: 10000
- assertVisible: "Try again"
- assertVisible: "Restore purchase"
