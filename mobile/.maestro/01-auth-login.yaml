appId: com.bubbleworkout.mobile
---
# Do NOT use clearState — pm clear invalidates the Maestro instrumentation context.

# First launchApp restarts the Maestro instrumentation (gRPC drops ~143ms after it
# returns). The host-side sleep bridges that gap while the new server starts.
# The second launchApp brings the app's activity to the foreground now that the
# instrumentation is stable — this one does NOT restart the instrumentation.
- launchApp:
    stopApp: false
- runScript:
    file: scripts/post-launch-sleep.js
- launchApp:
    stopApp: false
# Dev client always appears on launch. The dev-launcher no longer auto-lists
# discovered Metro servers as a tappable row (SDK 57) - type the address into
# the manual-entry field and tap Connect. Server is 10.0.2.2:8081 on the
# Android emulator (the emulator's address for the host machine).
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: "http://"
      - inputText: "http://10.0.2.2:8081"
      - tapOn: "Connect"
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 120000
      - tapOn: "Continue"
- tapOn:
    text: "Close"
    optional: true
# If a previous run left the app authenticated, log out through the UI instead of
# clearing app data. Clearing data leaves the Expo dev client on a blank surface.
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Settings"
      - extendedWaitUntil:
          visible: "Settings"
          timeout: 20000
      - scrollUntilVisible:
          element:
            text: "Log Out"
          direction: DOWN
      - tapOn: "Log Out"
      - extendedWaitUntil:
          visible: "Welcome"
          timeout: 15000
- runFlow:
    when:
      visible: "Welcome"
    commands:
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Email"
    timeout: 10000
- tapOn:
    id: "email-input"
- eraseText
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "password-input"
- eraseText
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible: "Program Review"
    timeout: 20000
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Settings"
      - extendedWaitUntil:
          visible: "Settings"
          timeout: 20000
      - scrollUntilVisible:
          element:
            text: "Log Out"
          direction: DOWN
      - tapOn: "Log Out"
      - extendedWaitUntil:
          visible: "Welcome"
          timeout: 15000
      - tapOn: "Sign in"
      - extendedWaitUntil:
          visible: "Email"
          timeout: 10000
      - tapOn:
          id: "email-input"
      - eraseText
      - inputText: ${TEST_EMAIL}
      - tapOn:
          id: "password-input"
      - eraseText
      - inputText: ${TEST_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: "login-submit-button"
      - extendedWaitUntil:
          visible: "Program Review"
          timeout: 20000
- tapOn: "Programs"
- extendedWaitUntil:
    visible: "Active Programs"
    timeout: 20000
- assertVisible: "Strength Block"
