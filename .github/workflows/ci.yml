name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-changes:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check deployment paths
        id: changes
        run: node scripts/deploy-changes.mjs

  # The local reusable workflow runs at this same commit. Default success()
  # semantics deliberately block deployment on failed, cancelled or skipped CI.
  deploy:
    needs: [test, e2e, native-drift-check, deploy-changes]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.deploy-changes.outputs.required == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/fly-deploy.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workout
          POSTGRES_PASSWORD: workout
          POSTGRES_DB: workout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run Flyway migrations
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/migrations:/flyway/sql" \
            flyway/flyway:10 \
            -url="jdbc:postgresql://127.0.0.1:5432/workout_test" \
            -user=workout \
            -password=workout \
            -locations=filesystem:/flyway/sql \
            migrate

      - name: Validate compiledConfig for all active program types
        working-directory: api
        env:
          DATABASE_URL: postgres://workout:workout@127.0.0.1:5432/workout_test
          NODE_ENV: test
        run: node scripts/check_configs.mjs

      - name: Run API tests
        working-directory: api
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: workout
          PGPASSWORD: workout
          PGDATABASE: workout_test
          NODE_ENV: test
          INTERNAL_API_TOKEN: ci-test-token
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
          JWT_ISSUER: workout-engine-ci
          REVENUECAT_WEBHOOK_SECRET: ci-test-webhook-secret
        run: npm test -- --test-concurrency=1

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: TypeScript check (mobile)
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Check production deployment gating
        working-directory: mobile
        run: node --test scripts/__tests__/deploy-ci-gating.test.mjs scripts/__tests__/ios-smoke-ci.test.mjs scripts/__tests__/ios-smoke-runner.test.mjs

      - name: Validate coverage manifest
        working-directory: mobile
        run: node scripts/validate-coverage-manifest.mjs

      - name: Check iOS crash-avoidance rules and release gate tests
        working-directory: mobile
        run: |
          node scripts/check-ios-safety.mjs
          node --test scripts/__tests__/check-ios-safety.test.mjs scripts/__tests__/validate-ios-signoff.test.mjs

      - name: Check accessibility label regression
        working-directory: mobile
        run: node scripts/check-a11y-regression.mjs

      - name: Check for stale brand strings
        working-directory: mobile
        run: node scripts/check-brand-strings.mjs

      - name: Run mobile tests
        working-directory: mobile
        run: npx vitest run --coverage

  native-drift-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Regenerate android/ and check for drift
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --no-install
          if ! git diff --exit-code -- android; then
            echo "::error::mobile/android/ is out of sync with app.json / native dependencies."
            echo "::error::Run 'npx expo prebuild --platform android' locally and commit the diff."
            exit 1
          fi
          UNTRACKED=$(git status --porcelain -- android | grep '^??' || true)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::expo prebuild created new files under android/ that are not committed:"
            echo "$UNTRACKED"
            exit 1
          fi

  # Split into a matrix so one slow/stuck flow only costs its own leg's time and
  # budget, not the whole suite's - previously all 7 flows ran sequentially in one
  # 45-minute job, so a single hang anywhere burned the entire budget and blocked
  # every flow behind it, including ones that had already passed. Flows 01-04 stay
  # together in one leg because 02/03/04 depend on 01's login session persisting in
  # the same running app instance (see 02-start-workout.yaml's precondition comment);
  # 05/06/07 each use their own independent account and can run standalone.
  #
  # Every `maestro test` invocation is now wrapped in `timeout` so a hang fails fast
  # instead of silently consuming the whole job. This is what makes the existing
  # retry-on-failure chains for 06/07 actually able to run a 2nd/3rd attempt - before
  # this, a hung first attempt would still be "running" when the job's own ceiling
  # killed it, so the `||` retries never got a chance to fire.
  #
  # Each leg's `timeout` (job-level minutes) looks generous for how little it does,
  # but the APK cache key includes a hash of `mobile/src/**`, so any PR touching
  # mobile source - most of them - forces every leg to independently cold-build the
  # APK from scratch (observed ~18-20 min alone). A tight per-leg budget that only
  # accounts for the flow itself will spuriously time out during that build, not
  # during Maestro - confirmed the hard way (see PR #386's first run, where a 20-min
  # single-flow leg died mid-`Build debug APK`, before a single `maestro test` ran).
  e2e-flows:
    # Without this, GitHub concatenates every matrix field (including the full
    # multi-line script) into the auto-generated check name - unreadable in the UI.
    name: e2e-flows (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-workout-settings-paywall
            timeout: 60
            script: |
              adb reverse tcp:3000 tcp:3000
              cd mobile && NODE_ENV=development EXPO_PUBLIC_API_BASE_URL=http://10.0.2.2:3000 EXPO_PUBLIC_DISABLE_NETWORK_MONITORING=true npx expo start --dev-client --port 8081 > /tmp/metro.log 2>&1 &
              npx --yes wait-on http://127.0.0.1:8081 --timeout 120000
              adb shell settings put global package_verifier_enable 0
              adb shell settings put global verifier_verify_adb_installs 0
              adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
              timeout 480 maestro test mobile/.maestro/01-auth-login.yaml -e TEST_EMAIL="$E2E_EMAIL" -e TEST_PASSWORD="$E2E_PASSWORD" --no-ansi
              timeout 480 maestro test mobile/.maestro/02-start-workout.yaml -e TEST_EMAIL="$E2E_EMAIL" -e TEST_PASSWORD="$E2E_PASSWORD" --no-ansi
              timeout 480 maestro test mobile/.maestro/03-settings-edit-name.yaml -e TEST_EMAIL="$E2E_EMAIL" -e TEST_PASSWORD="$E2E_PASSWORD" --no-ansi
              psql -v ON_ERROR_STOP=1 -c "UPDATE app_user SET subscription_status = 'expired', trial_expires_at = now() - interval '1 day', subscription_expires_at = NULL WHERE lower(email) = lower('$E2E_EMAIL');"
              timeout 480 maestro test mobile/.maestro/04-paywall.yaml -e TEST_EMAIL="$E2E_EMAIL" -e TEST_PASSWORD="$E2E_PASSWORD" --no-ansi
          # Unlike the other single-flow legs (06/07), this one shipped with no
          # retry, on the assumption one flow was inherently low-risk. Post-merge
          # data said otherwise: 3 of 4 real runs failed on the exact same
          # "Continue" assertion right after the dev-launcher connects (identical
          # boilerplate to every other flow, which aren't failing this way) - this
          # leg has zero margin against a single slow bundle load since it has
          # neither multiple flows nor a retry to absorb one bad attempt. This
          # flow's account is fixed and re-logged-into each time (not a fresh
          # registration like 06/07), so a same-account retry is safe.
          - name: program-complete
            timeout: 60
            script: |
              adb reverse tcp:3000 tcp:3000
              cd mobile && NODE_ENV=development EXPO_PUBLIC_API_BASE_URL=http://10.0.2.2:3000 EXPO_PUBLIC_DISABLE_NETWORK_MONITORING=true npx expo start --dev-client --port 8081 > /tmp/metro.log 2>&1 &
              npx --yes wait-on http://127.0.0.1:8081 --timeout 120000
              adb shell settings put global package_verifier_enable 0
              adb shell settings put global verifier_verify_adb_installs 0
              adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
              timeout 480 maestro test mobile/.maestro/05-program-complete.yaml -e TEST_EMAIL="$E2E_COMPLETE_EMAIL" -e TEST_PASSWORD="$E2E_COMPLETE_PASSWORD" --no-ansi || timeout 480 maestro test mobile/.maestro/05-program-complete.yaml -e TEST_EMAIL="$E2E_COMPLETE_EMAIL" -e TEST_PASSWORD="$E2E_COMPLETE_PASSWORD" --no-ansi || timeout 480 maestro test mobile/.maestro/05-program-complete.yaml -e TEST_EMAIL="$E2E_COMPLETE_EMAIL" -e TEST_PASSWORD="$E2E_COMPLETE_PASSWORD" --no-ansi
          # Flows 06/07 register a fresh account and pass through several real,
          # network-backed onboarding screens. Repeated investigation (see the
          # comments in both flow files) found the CI Android emulator can
          # occasionally become catastrophically slow across an entire run (one
          # observed run's login flow alone took 26 minutes vs. the normal ~2),
          # which no fixed assertion timeout can reliably absorb. Retry each flow
          # up to 3 times on failure via shell `||` chaining. A same-email retry
          # is not safe here - registration isn't idempotent, so a retry after a
          # partially-completed attempt would hit "email already exists" - so
          # each attempt gets a unique email suffix instead.
          #
          # IMPORTANT: this action (reactivecircus/android-emulator-runner)
          # executes each line of `script` as its OWN separate `sh -c` call, not
          # as one continuous multi-line shell script - a multi-line function
          # definition here will be split across those calls and fail with a
          # syntax error. Each retry chain below must stay on a single physical
          # line for that reason, however long that makes it.
          - name: onboarding-beginner
            timeout: 60
            script: |
              adb reverse tcp:3000 tcp:3000
              cd mobile && NODE_ENV=development EXPO_PUBLIC_API_BASE_URL=http://10.0.2.2:3000 EXPO_PUBLIC_DISABLE_NETWORK_MONITORING=true npx expo start --dev-client --port 8081 > /tmp/metro.log 2>&1 &
              npx --yes wait-on http://127.0.0.1:8081 --timeout 120000
              adb shell settings put global package_verifier_enable 0
              adb shell settings put global verifier_verify_adb_installs 0
              adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
              timeout 480 maestro test mobile/.maestro/06-onboarding-beginner.yaml -e ONBOARDING_TEST_EMAIL="${ONBOARDING_TEST_EMAIL}-r1" -e ONBOARDING_TEST_PASSWORD="$ONBOARDING_TEST_PASSWORD" --no-ansi || timeout 480 maestro test mobile/.maestro/06-onboarding-beginner.yaml -e ONBOARDING_TEST_EMAIL="${ONBOARDING_TEST_EMAIL}-r2" -e ONBOARDING_TEST_PASSWORD="$ONBOARDING_TEST_PASSWORD" --no-ansi || timeout 480 maestro test mobile/.maestro/06-onboarding-beginner.yaml -e ONBOARDING_TEST_EMAIL="${ONBOARDING_TEST_EMAIL}-r3" -e ONBOARDING_TEST_PASSWORD="$ONBOARDING_TEST_PASSWORD" --no-ansi
          - name: onboarding-intermediate
            timeout: 60
            script: |
              adb reverse tcp:3000 tcp:3000
              cd mobile && NODE_ENV=development EXPO_PUBLIC_API_BASE_URL=http://10.0.2.2:3000 EXPO_PUBLIC_DISABLE_NETWORK_MONITORING=true npx expo start --dev-client --port 8081 > /tmp/metro.log 2>&1 &
              npx --yes wait-on http://127.0.0.1:8081 --timeout 120000
              adb shell settings put global package_verifier_enable 0
              adb shell settings put global verifier_verify_adb_installs 0
              adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
              timeout 480 maestro test mobile/.maestro/07-onboarding-intermediate.yaml -e ONBOARDING2_TEST_EMAIL="${ONBOARDING2_TEST_EMAIL}-r1" -e ONBOARDING_TEST_PASSWORD="$ONBOARDING_TEST_PASSWORD" --no-ansi || timeout 480 maestro test mobile/.maestro/07-onboarding-intermediate.yaml -e ONBOARDING2_TEST_EMAIL="${ONBOARDING2_TEST_EMAIL}-r2" -e ONBOARDING_TEST_PASSWORD="$ONBOARDING_TEST_PASSWORD" --no-ansi || timeout 480 maestro test mobile/.maestro/07-onboarding-intermediate.yaml -e ONBOARDING2_TEST_EMAIL="${ONBOARDING2_TEST_EMAIL}-r3" -e ONBOARDING_TEST_PASSWORD="$ONBOARDING_TEST_PASSWORD" --no-ansi
    timeout-minutes: ${{ matrix.timeout }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workout
          POSTGRES_PASSWORD: workout-ci
          POSTGRES_DB: workout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: workout
      PGPASSWORD: workout-ci
      PGDATABASE: workout_test
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
      JWT_ISSUER: workout-engine-ci
      INTERNAL_API_TOKEN: ci-test-internal-api-token
      REVENUECAT_WEBHOOK_SECRET: ci-test-webhook-secret
      MAESTRO_CLI_NO_ANALYTICS: "1"
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: E2ePass123!
      E2E_COMPLETE_EMAIL: e2e-complete@example.com
      E2E_COMPLETE_PASSWORD: E2eComplete123!
      ONBOARDING_TEST_EMAIL: onboarding-beginner-ci@example.com
      ONBOARDING_TEST_PASSWORD: OnboardingCi123!
      ONBOARDING2_TEST_EMAIL: onboarding-intermediate-ci@example.com

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run Flyway migrations
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/migrations:/flyway/sql" \
            flyway/flyway:10 \
            -url="jdbc:postgresql://127.0.0.1:5432/workout_test" \
            -user=workout \
            -password=workout-ci \
            -locations=filesystem:/flyway/sql \
            migrate

      - name: Start API
        run: |
          node api/server.js &
          npx --yes wait-on http://127.0.0.1:3000/health --timeout 30000

      - name: Provision E2E test account
        run: bash scripts/provision-e2e-db.sh
        env:
          API_URL: http://127.0.0.1:3000

      - name: Provision E2E complete account
        run: bash scripts/provision-e2e-complete.sh
        env:
          API_URL: http://127.0.0.1:3000

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: APK cache
        id: apk-cache
        uses: actions/cache@v6
        with:
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-debug-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/src/**', 'mobile/assets/**', 'mobile/package-lock.json') }}

      - name: Build debug APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Maestro cache
        id: maestro-cache
        uses: actions/cache@v6
        with:
          path: ~/.maestro
          key: maestro-2.5.1

      - name: Install Maestro 2.5.1
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: |
          export MAESTRO_VERSION=2.5.1
          curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # android-emulator-runner always runs `sdkmanager --install emulator` and the
      # system image itself, and those downloads intermittently fail on the runner
      # ("Failed to download package!", "Error on ZipFile unknown archive"), after which
      # the emulator never launches. Retrying the whole emulator step seconds later on
      # the same runner hits the same broken download, so pre-install both packages here
      # with backoff, clearing sdkmanager's partial-download temp dir between attempts.
      # Once installed, the action's own install calls are no-ops.
      - name: Pre-install Android emulator and system image (with retries)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          for attempt in 1 2 3 4 5; do
            # sdkmanager can exit 0 after a failed download, so also check for its known
            # failure messages and for the installed files. A partial extraction can leave the
            # emulator launcher present but missing one of its own bundled libraries ("emulator:
            # error while loading shared libraries: libandroid-emu-curl.so"), which crashes it at
            # launch and costs the full 600s boot timeout. `ldd` on the launcher reports a missing
            # bundled library as "not found" in seconds. Only the emulator's own bundled libraries
            # (libandroid-*) count: unresolved system libraries (e.g. libX11) are environment, not
            # a broken download, and a reinstall can't fix them. Don't run `emulator -version`
            # instead: it starts the qemu binary without -no-audio, which needs libpulse.so.0
            # (absent on the runner), so it fails even on a healthy install.
            if "$SDKM" --install emulator 'system-images;android-34;default;x86_64' --channel=0 > /tmp/sdkmanager.log 2>&1 \
              && ! grep -qiE "an error occurred while preparing|failed to download" /tmp/sdkmanager.log \
              && [ -x "$ANDROID_HOME/emulator/emulator" ] \
              && [ -f "$ANDROID_HOME/system-images/android-34/default/x86_64/system.img" ] \
              && { ldd "$ANDROID_HOME/emulator/emulator" > /tmp/emulator-ldd.log 2>&1 || true; } \
              && ! grep "not found" /tmp/emulator-ldd.log | grep -q "libandroid-"; then
              echo "emulator and system image installed, launcher libraries resolved, on attempt $attempt"
              exit 0
            fi
            echo "::warning::SDK package install attempt $attempt failed:"
            grep -iE "error|warning" /tmp/sdkmanager.log | head -5 || true
            grep "not found" /tmp/emulator-ldd.log 2>/dev/null | head -3 || true
            # sdkmanager treats an already-installed (even broken) emulator as up to date, so
            # remove it before retrying or every attempt reuses the same broken files.
            "$SDKM" --uninstall emulator > /dev/null 2>&1 || true
            rm -rf "$ANDROID_HOME/emulator" "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            sleep $((attempt * 20))
          done
          echo "::error::Could not install the Android emulator/system image after 5 attempts"
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator itself is the flakiest part of this job: the runner intermittently
      # fails to download the emulator/system-image package ("Failed to download
      # package!") or the emulator never finishes booting ("Timeout waiting for
      # emulator to boot", then "could not connect to TCP port 5554"). Both happen
      # before any flow runs. So attempt 1 may fail softly, and attempt 2 runs only
      # if the flow script never started. The script's first line drops a marker
      # file, and the action only reaches the script once the emulator has booted.
      # A same-job retry after the script started is NOT safe: registration isn't
      # idempotent and the job's Postgres keeps state, so real test failures go
      # straight to the "Fail if" step below instead of being retried.
      - name: Run E2E flows
        id: e2e_attempt1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          avd-name: e2e-pixel6-api34
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            touch e2e-script-started.marker
            ${{ matrix.script }}

      - name: Run E2E flows (retry after emulator start-up failure)
        id: e2e_attempt2
        if: steps.e2e_attempt1.outcome == 'failure' && hashFiles('e2e-script-started.marker') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          avd-name: e2e-pixel6-api34
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ${{ matrix.script }}

      - name: Fail if the E2E flows failed after the emulator started
        if: steps.e2e_attempt1.outcome == 'failure' && hashFiles('e2e-script-started.marker') != ''
        run: |
          echo "::error::E2E flow failed after the emulator booted (attempt 1); not retried because registration isn't idempotent."
          exit 1

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-${{ matrix.name }}
          path: ~/.maestro/tests/
          if-no-files-found: ignore

      - name: Upload Metro log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: metro-log-${{ matrix.name }}
          path: /tmp/metro.log
          if-no-files-found: ignore

  # Single check named "e2e" gating on every e2e-flows matrix leg, so branch
  # protection's existing required-check name ("e2e") keeps working unchanged even
  # though the actual work now runs as several separately-named matrix jobs.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: e2e-flows
    if: always()
    steps:
      - name: Check e2e-flows result
        run: |
          if [ "${{ needs.e2e-flows.result }}" != "success" ]; then
            echo "One or more e2e-flows matrix legs failed: ${{ needs.e2e-flows.result }}"
            exit 1
          fi
