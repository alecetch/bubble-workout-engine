name: fly-deploy-api

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "migrations/**"
      - "scripts/migrate.sh"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workout
          POSTGRES_PASSWORD: workout
          POSTGRES_DB: workout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Audit API dependencies
        working-directory: api
        run: npm audit --audit-level=high

      - name: Run Flyway migrations
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/migrations:/flyway/sql" \
            flyway/flyway:10 \
            -url="jdbc:postgresql://127.0.0.1:5432/workout_test" \
            -user=workout \
            -password=workout \
            -locations=filesystem:/flyway/sql \
            migrate

      - name: Run tests
        working-directory: api
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: workout
          PGPASSWORD: workout
          PGDATABASE: workout_test
          NODE_ENV: test
          INTERNAL_API_TOKEN: ci-test-token
          ENGINE_KEY: ci-test-key
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
          JWT_ISSUER: workout-engine-ci
          REVENUECAT_WEBHOOK_SECRET: ci-test-webhook-secret
        run: npm test -- --test-concurrency=1

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Start Fly MPG proxy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl mpg proxy "${{ vars.FLY_MPG_CLUSTER_ID }}" --local-port 15432 > /tmp/fly-mpg-proxy.log 2>&1 &
          for i in $(seq 1 15); do
            nc -z 127.0.0.1 15432 2>/dev/null && echo "Proxy ready after ${i}s" && break
            echo "Waiting for proxy... (${i}s)"
            sleep 1
          done
          nc -z 127.0.0.1 15432 2>/dev/null || { echo "ERROR: MPG proxy did not start within 15s"; cat /tmp/fly-mpg-proxy.log; exit 1; }

      - name: Run Flyway migrations and verify seeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          chmod +x scripts/migrate.sh
          PROXY_URL=$(node -e '
            const u = new URL(process.env.DATABASE_URL);
            u.hostname = "127.0.0.1";
            u.port = "15432";
            u.searchParams.set("sslmode", "disable");
            process.stdout.write(u.toString());
          ')
          DATABASE_URL="$PROXY_URL" ./scripts/migrate.sh
          DATABASE_URL="$PROXY_URL" npm --prefix api run qa:seeds

      - name: Deploy API to Fly
        working-directory: api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.toml --remote-only
