<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HYROX Submissions</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --panel: #ffffff;
        --border: #d8dee6;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #0f62fe;
        --success: #198754;
        --danger: #dc3545;
        --orange: #e06900;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Segoe UI, Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .topbar {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .topbar h1 {
        margin: 0;
        font-size: 18px;
        flex: none;
      }
      .topbar a {
        font-size: 12px;
        color: var(--primary);
        text-decoration: none;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        flex: 1;
      }
      .controls input {
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        min-width: 180px;
      }
      .controls input.wide { min-width: 260px; }
      button {
        font: inherit;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .status {
        font-size: 13px;
        color: var(--muted);
      }
      .status.ok { color: var(--success); }
      .status.err { color: var(--danger); }
      .main { padding: 16px 18px; }
      .table-wrap { overflow-x: auto; }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--panel);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      th, td {
        border-bottom: 1px solid #ebeff5;
        padding: 8px 10px;
        vertical-align: middle;
        text-align: left;
        font-size: 13px;
      }
      th {
        background: #f9fbfd;
        font-weight: 600;
        white-space: nowrap;
      }
      tr:last-child td { border-bottom: none; }
      .badge {
        display: inline-block;
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge-yes { background: #d1fae5; color: #065f46; }
      .badge-no  { background: #f1f5f9; color: #94a3b8; }
      .preview-link {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        font-size: 12px;
      }
      .preview-link:hover { text-decoration: underline; }
      .mono { font-family: Consolas, monospace; font-size: 11px; color: var(--muted); }
      .empty { color: var(--muted); padding: 20px 0; text-align: center; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>🏃 HYROX Submissions</h1>
      <a href="/admin-ui" target="_blank">← Config Admin</a>
      <div class="controls">
        <input id="token-input" type="password" placeholder="x-internal-token" style="min-width:200px" />
        <input id="email-input" class="wide" type="text" placeholder="Filter by email (optional)" />
        <button id="load-btn" class="primary">Load</button>
        <span id="status" class="status"></span>
      </div>
    </div>
    <div class="main">
      <div class="table-wrap">
        <table id="submissions-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>Name</th>
              <th>Division</th>
              <th>Finish</th>
              <th>Race</th>
              <th>Submitted</th>
              <th>Carousel</th>
              <th>Preview</th>
            </tr>
          </thead>
          <tbody id="submissions-body">
            <tr><td colspan="8" class="empty">Enter your token and click Load.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <script type="module">
      const STORAGE_KEY = "admin_internal_api_token";
      const tokenInput = document.getElementById("token-input");
      const emailInput = document.getElementById("email-input");
      const loadBtn = document.getElementById("load-btn");
      const statusEl = document.getElementById("status");
      const tbody = document.getElementById("submissions-body");

      const saved = sessionStorage.getItem(STORAGE_KEY);
      if (saved) tokenInput.value = saved;

      function setStatus(msg, kind = "") {
        statusEl.textContent = msg;
        statusEl.className = `status ${kind}`;
      }

      function escHtml(v) {
        return String(v ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function formatSeconds(secs) {
        if (!secs) return "—";
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        return `${m}:${String(s).padStart(2, "0")}`;
      }

      function formatDate(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        return d.toLocaleString(undefined, {
          year: "numeric", month: "short", day: "numeric",
          hour: "2-digit", minute: "2-digit",
        });
      }

      function renderRows(submissions) {
        if (!submissions.length) {
          tbody.innerHTML = '<tr><td colspan="8" class="empty">No submissions found.</td></tr>';
          return;
        }
        tbody.innerHTML = submissions.map((s) => {
          const carouselBadge = s.has_carousel
            ? '<span class="badge badge-yes">Yes</span>'
            : '<span class="badge badge-no">No</span>';
          const previewCell = s.has_carousel
            ? `<a class="preview-link" href="/api/hyrox/carousel/${escHtml(s.submission_id)}" target="_blank">Open ↗</a>`
            : '<span style="color:var(--muted);font-size:12px">—</span>';
          return `<tr>
            <td>${escHtml(s.email)}</td>
            <td>${escHtml(s.display_name || "—")}</td>
            <td>${escHtml(s.division)}</td>
            <td>${escHtml(formatSeconds(s.finish_time_seconds))}</td>
            <td>${escHtml(s.race_name || "—")}</td>
            <td>${escHtml(formatDate(s.created_at))}</td>
            <td>${carouselBadge}</td>
            <td>${previewCell}</td>
          </tr>`;
        }).join("");
      }

      async function loadSubmissions() {
        const token = tokenInput.value.trim();
        if (!token) { setStatus("Paste your x-internal-token first.", "err"); return; }
        sessionStorage.setItem(STORAGE_KEY, token);

        const email = emailInput.value.trim();
        const qs = email ? `?email=${encodeURIComponent(email)}` : "";

        setStatus("Loading…");
        try {
          const res = await fetch(`/admin/hyrox/submissions${qs}`, {
            headers: { "x-internal-token": token },
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          renderRows(data.submissions || []);
          setStatus(`Loaded ${(data.submissions || []).length} submissions`, "ok");
        } catch (err) {
          setStatus(err.message || "Load failed", "err");
        }
      }

      loadBtn.addEventListener("click", loadSubmissions);
      emailInput.addEventListener("keydown", (e) => { if (e.key === "Enter") loadSubmissions(); });
    </script>
  </body>
</html>
